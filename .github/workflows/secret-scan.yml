name: Secret scan

# Runs gitleaks on every pushed commit and every pull request so a committed
# key fails CI before it spreads. Only the new commits are scanned, so old
# history findings that were already triaged do not block work. No repo
# secrets are needed: GITHUB_TOKEN is the automatic per-run token, and personal
# accounts do not need a GITLEAKS_LICENSE.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists the pull request's commits to scan them.
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          # Keep secret values out of PR comments, artifacts and the job summary.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
